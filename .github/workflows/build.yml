name: Build Pipeline

# Github Events
on:
  push:
    branches: [ "dev" ]
env:
  APPLICATION_NAME: "onlinebookstore"
  IMAGE_TAG: "0.1"

jobs:
  maven_build:
    runs-on: ubuntu-latest # GitHub Runner
    permissions:
      contents: read
      packages: write
    outputs:
      artifact_id: ${{ steps.upload_artifacts.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v3

      - name: maven build
        run: mvn -B clean install package --file pom.xml

      - uses: actions/upload-artifact
        id: upload_artifacts
        with:
          name: WAR file
          path: target/onlinebookstore-0.0.1-SNAPSHOT.war

  docker_build:
    runs-on: ubuntu-latest
    needs:
      - maven_build
    steps:
      - uses: actions/checkout@v3

      - name: print upload artifact id
        env:
          maven_build_artifact_id: ${{ needs.maven_build.outputs.artifact_id }}
        run: echo "Artifact ID from previous job is ${maven_build_artifact_id}

      - name: docker build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/$APPLICATION_NAME:$IMAGE_TAG .

      - name: docker login
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: docker image push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/$APPLICATION_NAME:$IMAGE_TAG